# Relative Pfade beziehen sich auf den Ordner dieser Datei.

logging:
  # directory: 'logs'      # auskommentiert lassen = 'logs' neben der exe
  level: Information       # Verbose | Debug | Information | Warning | Error | Fatal

eplan:
  platform_bin: 'C:\Program Files\EPLAN\Platform\2025.0.3\Bin'
  product_bin: 'C:\Program Files\EPLAN\Electric P8\2025.0.3\Bin'
  application_modifier: ''   # leer = Variante aus der install.xml

database:
  path: 'exports.db'         # SQLite: merkt sich, welche Projekte mit welchem Stand exportiert wurden

export:
  project_folder: 'D:\EPLAN\Projekte'
  recursive: true
  # Projekte (*.elk) und Projektarchive (*.zw1); Archive werden nach %TEMP%\EplanElectricP8Api\<Dateiname>
  # wiederhergestellt, exportiert und danach wieder gelöscht
  file_patterns:
    - '*.elk'
    - '*.zw1'
  output_folder: 'D:\EPLAN\Export'   # pro Projekt wird ein Unterordner mit dem Projektnamen angelegt
  # Quartz Cron mit 6 Feldern: Sek Min Std Tag Monat Wochentag
  #   täglich um 02:00     : '0 0 2 * * ?'
  #   jede Stunde          : '0 0 * * * ?'
  #   alle 15 Minuten      : '0 0/15 * * * ?'
  #   werktags um 06:00    : '0 0 6 ? * MON-FRI'
  cron_schedule: '0 0 2 * * ?'
  open_mode: ReadOnly        # ReadOnly | Standard | Exclusive
  language: de_DE
  # Verbindungen werden immer direkt nach '{project}_Verbindungen.csv' exportiert (ohne Schema).
  # Optionale zusätzliche Beschriftungs-Exporte (EPLAN Action "label"); {project} = Projektname
  labels: []
  #  - name: Betriebsmittelliste
  #    config_scheme: Device tag list
  #    file_name: '{project}_Betriebsmittel.txt'
